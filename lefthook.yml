# lefthook.yml — ddl-managed gates (created by `ddl init --gates`)
# Managed blocks: markers `# ddl:managed:start/end (hook)` — edit around them.

pre-commit:
  commands:
    bd:
      run: bd hooks run pre-commit
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --diff-only --mode gate
    ddl-spk-lint:
      run: spk lint openspec/specs || test $? -eq 2
    # ddl:managed:end (pre-commit)

    # Opt-in committed-render drift gate. Uncomment after committing BRIEF.md and
    # BRIEF.json (regenerate with `podras brief --write`): the hook compares both
    # artifacts against a fresh render and exits 0 when this repository has no
    # committed renders, so adopting repositories that never render stay green.
    # Requires `podras` on PATH, or set PODRAS_BIN to its path in the environment
    # lefthook runs in. Kept outside the ddl:managed blocks so `ddl init --gates`
    # never owns it.
    # brief-drift:
    #   run: scripts/guards/brief-drift.sh

pre-push:
  commands:
    bd:
      run: bd hooks run pre-push
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
