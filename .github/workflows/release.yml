# Release workflow — build cross-platform binaries, publish a GitHub release,
# publish to crates.io, and auto-update the homebrew-charly tap and scoop-charly
# bucket.
#
# Triggered by pushing a version tag (e.g., `git tag v0.1.0 && git push --tags`).
# Mirrors the dulce-de-leche reference release workflow, adapted to podras.
#
# Security model (SEC-06, per standardization §1):
#   * Workflow-level permissions default to `contents: read`; only the jobs
#     that touch releases/publishing are granted `contents: write`.
#   * Publication credentials (CARGO_REGISTRY_TOKEN, TAP_GITHUB_TOKEN,
#     GITHUB_TOKEN) are referenced exclusively inside the publishing jobs.
#   * Every third-party action is pinned to a full reviewed commit SHA.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux

      - name: Install aarch64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build x86_64 Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build aarch64 Linux
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Stage binaries
        run: |
          mkdir -p bins/linux_amd64 bins/linux_arm64
          cp target/x86_64-unknown-linux-gnu/release/podras bins/linux_amd64/podras
          cp target/aarch64-unknown-linux-gnu/release/podras bins/linux_arm64/podras

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-linux
          path: bins/
          retention-days: 1

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: darwin

      - name: Build x86_64 macOS
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64 macOS
        run: cargo build --release --target aarch64-apple-darwin

      - name: Stage binaries
        run: |
          mkdir -p bins/darwin_amd64 bins/darwin_arm64
          cp target/x86_64-apple-darwin/release/podras bins/darwin_amd64/podras
          cp target/aarch64-apple-darwin/release/podras bins/darwin_arm64/podras

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-darwin
          path: bins/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows

      - name: Build x86_64 Windows
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p bins/windows_amd64
          cp target/x86_64-pc-windows-msvc/release/podras.exe bins/windows_amd64/podras.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-windows
          path: bins/
          retention-days: 1

  # Package the five archives, generate checksums.txt, and publish the GitHub
  # Release for the tag.
  release:
    name: GitHub Release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bins-*
          path: bins/
          merge-multiple: true

      - name: Package archives and checksums
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # upload-artifact v4 does not preserve file permissions — restore the
          # exec bit or the tarballs ship 644 binaries and `curl | tar xz`
          # installs a non-runnable podras.
          chmod +x -- bins/*/*
          tar -czf "dist/podras_${VERSION}_linux_amd64.tar.gz"  -C bins/linux_amd64  podras
          tar -czf "dist/podras_${VERSION}_linux_arm64.tar.gz"  -C bins/linux_arm64  podras
          tar -czf "dist/podras_${VERSION}_darwin_amd64.tar.gz" -C bins/darwin_amd64 podras
          tar -czf "dist/podras_${VERSION}_darwin_arm64.tar.gz" -C bins/darwin_arm64 podras
          (cd bins/windows_amd64 && zip "../../dist/podras_${VERSION}_windows_amd64.zip" podras.exe)
          cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Create GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.pkg.outputs.version }}"
          PRERELEASE=""
          [[ "${TAG}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            $PRERELEASE \
            dist/podras_${VERSION}_linux_amd64.tar.gz \
            dist/podras_${VERSION}_linux_arm64.tar.gz \
            dist/podras_${VERSION}_darwin_amd64.tar.gz \
            dist/podras_${VERSION}_darwin_arm64.tar.gz \
            dist/podras_${VERSION}_windows_amd64.zip \
            dist/checksums.txt
        env:
          # No checkout in this job — gh cannot infer the repo from a local
          # git remote, so point it at the repository explicitly.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Publish the crate to crates.io after all binaries are built and the GitHub
  # Release exists.
  publish-cargo:
    name: Publish to crates.io
    needs: [build-linux, build-darwin, build-windows, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Bump the homebrew-charly tap formula to the new version and sha256 from
  # the release assets. Mirrors the ddl reference workflow's channel-update
  # step: idempotent, retried, disabled (not failed) when TAP_GITHUB_TOKEN is
  # absent, and reported as failed if all attempts fail.
  update-homebrew:
    name: Update homebrew-charly tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Update Homebrew tap
        id: channel-homebrew
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          CHANNEL_STATUS=/tmp/channel-homebrew.status
          MAX_ATTEMPTS=3
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "disabled" > "${CHANNEL_STATUS}"
            echo "::notice::Homebrew tap update is disabled (TAP_GITHUB_TOKEN not set); the release will be marked accordingly."
            exit 0
          fi
          ok=0
          attempt=1
          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            rm -rf /tmp/tap
            # Bump the formula's version, tag URL, and platform sha256s from
            # the release checksums.txt (darwin=mac, linux=linux; arm64/aarch64
            # vs amd64/x86_64 naming mapped to the formula's class suffixes).
            if git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/charly-vibes/homebrew-charly.git" /tmp/tap \
              && python3 scripts/update-homebrew.py \
                   /tmp/tap/Formula/podras.rb \
                   "${VERSION}" "${TAG}" dist/checksums.txt; then
              git -C /tmp/tap config user.email "github-actions@github.com"
              git -C /tmp/tap config user.name "GitHub Actions"
              git -C /tmp/tap add Formula/podras.rb
              if git -C /tmp/tap diff --staged --quiet; then
                echo "unchanged" > "${CHANNEL_STATUS}"
                ok=1
                break
              fi
              if git -C /tmp/tap commit -m "Update podras to ${VERSION}" \
                && git -C /tmp/tap push; then
                echo "updated" > "${CHANNEL_STATUS}"
                ok=1
                break
              fi
            fi
            echo "::warning::Homebrew tap update attempt ${attempt}/${MAX_ATTEMPTS} failed; retrying."
            attempt=$((attempt + 1))
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            echo "failed" > "${CHANNEL_STATUS}"
            echo "::error::Homebrew tap update failed after ${MAX_ATTEMPTS} attempts."
            exit 1
          fi

  # Bump the scoop-charly bucket manifest to the new version and sha256 from
  # the release assets. Same conventions as the ddl reference workflow.
  update-scoop:
    name: Update scoop-charly bucket
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Update Scoop bucket
        id: channel-scoop
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          CHANNEL_STATUS=/tmp/channel-scoop.status
          MAX_ATTEMPTS=3
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "disabled" > "${CHANNEL_STATUS}"
            echo "::notice::Scoop bucket update is disabled (TAP_GITHUB_TOKEN not set); the release will be marked accordingly."
            exit 0
          fi
          ok=0
          attempt=1
          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            rm -rf /tmp/scoop
            if git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/charly-vibes/scoop-charly.git" /tmp/scoop \
              && python3 scripts/update-scoop.py \
                   /tmp/scoop/bucket/podras.json \
                   "${VERSION}" "${TAG}" dist/checksums.txt; then
              git -C /tmp/scoop config user.email "github-actions@github.com"
              git -C /tmp/scoop config user.name "GitHub Actions"
              git -C /tmp/scoop add bucket/podras.json
              if git -C /tmp/scoop diff --staged --quiet; then
                echo "unchanged" > "${CHANNEL_STATUS}"
                ok=1
                break
              fi
              if git -C /tmp/scoop commit -m "Update podras to ${VERSION}" \
                && git -C /tmp/scoop push; then
                echo "updated" > "${CHANNEL_STATUS}"
                ok=1
                break
              fi
            fi
            echo "::warning::Scoop bucket update attempt ${attempt}/${MAX_ATTEMPTS} failed; retrying."
            attempt=$((attempt + 1))
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            echo "failed" > "${CHANNEL_STATUS}"
            echo "::error::Scoop bucket update failed after ${MAX_ATTEMPTS} attempts."
            exit 1
          fi
